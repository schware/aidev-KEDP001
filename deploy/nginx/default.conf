# kedp-nginx: 화면(정적 파일)을 내보내고 /api는 go container로 넘긴다(KEDP001-D023).
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # 관리자 API 본문은 64 KiB까지다(specification/40.api 5.1).
    client_max_body_size 64k;

    # Docker 내부 DNS. go container를 다시 만들어 주소가 바뀌어도 다시 찾는다.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $go http://go:8080;
        proxy_pass $go;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 실제 접속 주소로 덮어쓴다(덧붙이지 않는다). Go는 믿을 proxy(KEDP_TRUSTED_PROXIES)에서 온
        # 요청만 이 값으로 관리자 허용 IP를 본다(40.api 5.1).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # vite build가 만든 파일. 이름에 내용 hash가 붙어 있어 오래 둔다.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # /indicator/{id}, /admin/... 에서 새로고침해도 화면이 뜨도록 없는 주소는 index.html을 준다.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
