# kedp-nginx: 화면(정적 파일)을 내보내고 /api는 go container로 넘긴다(KEDP001-D023).

# 접속 기록(KEDP001-D026). Go, Rust와 같은 key=value 한 줄이다.
#   time=2026-11-24T09:12:40.123+09:00 level=INFO comp=nginx event=http.access req=4f1c… method=GET path=/api/indicators status=200 ms=12
# 일반 사용자의 접속 주소, User-Agent, Referer, X-Forwarded-For는 남기지 않는다(specification/40.api 6.1).
# path는 query string을 뺀 요청 주소다(인코딩된 그대로라 공백이 없다).
# 이 파일은 nginx.conf의 http 안에 include되므로 map, log_format을 여기에 둔다.

# 밀리초: $msec(1732410760.123)의 소수 부분
map $msec $kedp_msec {
    "~\.(?<f>\d{3})$" $f;
    default             000;
}

# 시각: $time_iso8601(2026-11-24T09:12:40+09:00, image의 TZ=Asia/Seoul)에 밀리초를 넣는다
map $time_iso8601 $kedp_time {
    "~^(?<d>\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d)(?<z>.*)$" "$d.$kedp_msec$z";
    default                                                     $time_iso8601;
}

# 걸린 시간: $request_time(초, 0.012)을 밀리초 정수(12)로
map $request_time $kedp_ms {
    "~^0\.0*(?<f>\d+)$"            $f;
    "~^(?<s>[1-9]\d*)\.(?<f>\d{3})$" "$s$f";
    default                          $request_time;
}

# query string을 뺀 경로
map $request_uri $kedp_path {
    "~^(?<p>[^?]*)" $p;
    default         $uri;
}

# 응답 코드 → level(D026 3장, b-go-end와 같다): 2xx·3xx·404·로그인 안 한 GET /api/admin/session 401은 INFO,
# 그 밖의 4xx는 WARN, 5xx는 ERROR
map "$request_method $kedp_path $status" $kedp_level {
    "GET /api/admin/session 401" INFO;
    "~ 404$"                     INFO;
    "~ 5\d\d$"                 ERROR;
    "~ 4\d\d$"                 WARN;
    default                      INFO;
}

log_format kedp escape=default
    'time=$kedp_time level=$kedp_level comp=nginx event=http.access req=$request_id '
    'method=$request_method path=$kedp_path status=$status ms=$kedp_ms';

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # nginx.conf의 기본 access_log(main: 접속 주소, User-Agent를 남긴다)를 대신한다.
    # access.log는 image에서 /dev/stdout이다. error log는 nginx 형식 그대로 둔다.
    access_log /var/log/nginx/access.log kedp;

    # 관리자 API 본문은 64 KiB까지다(specification/40.api 5.1).
    client_max_body_size 64k;

    # Docker 내부 DNS. go container를 다시 만들어 주소가 바뀌어도 다시 찾는다.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $go http://go:8080;
        proxy_pass $go;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 실제 접속 주소로 덮어쓴다(덧붙이지 않는다). Go는 믿을 proxy(KEDP_TRUSTED_PROXIES)에서 온
        # 요청만 이 값으로 관리자 허용 IP를 본다(40.api 5.1).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 요청 ID(D026 5장). go는 그 요청의 모든 줄에 req로 붙이고 응답 헤더로 돌려준다.
        # 바깥에서 보낸 X-Request-ID는 이 값으로 덮어쓴다.
        proxy_set_header X-Request-ID $request_id;
    }

    # vite build가 만든 파일. 이름에 내용 hash가 붙어 있어 오래 둔다.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # /indicator/{id}, /admin/... 에서 새로고침해도 화면이 뜨도록 없는 주소는 index.html을 준다.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
