// KEDP Go–Rust 약속서 첫 버전 (KEDP001-D002, D007, D020, D022).
// Go(수집)가 제공처 응답을 받을 때마다 Rust(처리 서버)에 넘기고, Rust는 DB에 쓴 결과를 돌려준다.
// 필드마다 뜻과 근거 결정은 b-proto/README.md에 있다.
syntax = "proto3";

package kedp.v1;

import "google/protobuf/timestamp.proto";

// Rust 처리 서버. Go가 부르고 Rust가 받는다(KEDP001-D002).
service ProcessorService {
  // 상태 확인. Go는 시작할 때 부르고, 실패하면 멈춘다(KEDP001-D020).
  // Rust가 DB에 접속할 수 있을 때만 성공한다. DB에 아무것도 쓰지 않는다.
  rpc Check(CheckRequest) returns (CheckResponse);

  // 제공처 응답 하나(한 페이지)를 처리한다.
  // 응답이 여러 페이지면 페이지마다 부르고, 같은 수집은 같은 run_id를 쓴다.
  rpc ProcessPage(ProcessPageRequest) returns (ProcessPageResponse);
}

message CheckRequest {}

// 비어 있다. gRPC 상태가 OK이면 정상이다.
message CheckResponse {}

// 키 값과 키가 들어간 주소는 넣지 않는다(.claude/api.md).
message ProcessPageRequest {
  // 수집 기록 id(collection_run.id). Go가 Rust를 부르기 전에 만든다.
  int64 run_id = 1;
  // 지표 id(indicator.id). Rust는 이 id로 indicator 테이블에서 지표 정의를 읽는다.
  string indicator_id = 2;
  // 페이지 번호. 1부터 센다.
  int32 page = 3;
  // 응답을 받은 시각
  google.protobuf.Timestamp received_at = 4;
  // HTTP 상태 코드
  int32 http_status = 5;
  // 키 자리를 ***로 가린 요청 주소
  string request_masked = 6;
  // 응답 원문. 받은 바이트 그대로 넘긴다.
  bytes body = 7;
}

message ProcessPageResponse {
  ProcessStatus status = 1;
  // observation에 새로 넣은 행 수
  int32 inserted_count = 2;
  // 값이 달라져 덮어쓴 행 수(observation_history에 남은 행 수와 같다)
  int32 updated_count = 3;
  // 이미 같은 값이 있던 행 수
  int32 unchanged_count = 4;
  // 값이 비어 건너뛴 행 수(KEDP001-D022 15)
  int32 skipped_empty_count = 5;
  // 오류 코드. SUCCESS이면 비어 있다.
  string error_code = 6;
  // 오류 메시지. SUCCESS이면 비어 있다.
  string error_message = 7;
}

// 처리 결과. collection_run.status의 success, no_data, error에 대응한다.
enum ProcessStatus {
  // 쓰지 않는다. 받으면 오류로 다룬다.
  PROCESS_STATUS_UNSPECIFIED = 0;
  // 정상
  PROCESS_STATUS_SUCCESS = 1;
  // 제공처가 데이터 없음으로 답했다.
  PROCESS_STATUS_NO_DATA = 2;
  // 제공처 오류이거나 응답을 읽을 수 없다.
  PROCESS_STATUS_ERROR = 3;
}
