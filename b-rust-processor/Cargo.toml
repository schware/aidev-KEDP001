[package]
name = "kedp-processor"
version = "0.1.0"
edition = "2024"
publish = false
description = "KEDP Rust 처리 서버: Go가 넘긴 제공처 응답을 읽어 DB에 쓴다"

[dependencies]
chrono = "0.4.45"
deadpool-postgres = { version = "0.14.2", features = ["rt_tokio_1"] }
prost = "0.14.4"
prost-types = "0.14.4"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4"] }
tonic = "0.14.7"
tonic-prost = "0.14.7"

[build-dependencies]
tonic-prost-build = "0.14.7"
